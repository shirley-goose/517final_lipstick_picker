robot:
  type: bi_so_follower
  id: bi_follower

  left_arm_config:
    port: /dev/ttyACM1

  right_arm_config:
    port: /dev/ttyACM3

  cameras:
    left_wrist:
      type: opencv
      index_or_path: /dev/video8
      backend: V4L2
      width: 640
      height: 480
      fps: 30
      fourcc: MJPG

    right_wrist:
      type: opencv
      index_or_path: /dev/video1
      backend: V4L2
      width: 640
      height: 480
      fps: 30
      fourcc: MJPG

    realsense:
      type: intelrealsense
      serial_number_or_name: "348522076012"
      width: 640
      height: 480
      fps: 30
      use_depth: false
      warmup_s: 8